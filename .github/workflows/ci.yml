name: CI

# 依赖安装 / 环境准备 / 校验逻辑都在 scripts/ci/（Windows 为 .ps1，Linux/macOS
# 为 .sh）；workflow 只负责矩阵与编排，无控制流的单命令步骤（cmake --build /
# ctest 等）保留为内联 run。约定见 docs/development/ci-scripts.md。

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-debug
            os: ubuntu-latest
            preset: debug
          - name: ubuntu-gcc-release
            os: ubuntu-latest
            preset: release
          - name: ubuntu-clang-debug
            os: ubuntu-latest
            preset: debug
            cc: clang
            cxx: clang++
          - name: windows-msvc-debug
            os: windows-latest
            preset: debug
            # Windows 上通过 vcpkg 提供 zlib/libjpeg/libwebp；Qt6 用官方 MSVC 预编译包
            # （见下方 Install Qt 步骤），GUI 与 CLI 一起构建并测试。
          - name: macos-clang-debug
            os: macos-latest
            preset: debug
    steps:
      - uses: actions/checkout@v7

      # 依赖安装 / 环境准备逻辑都在 scripts/ci/（Windows 用 .ps1，其余用 .sh）；
      # 完整清单与理由见各脚本头部注释。
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-deps-linux.sh

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci/install-deps-macos.sh

      - name: Set up vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/setup-vcpkg-windows.ps1

      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-vcpkg-deps-windows.ps1

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-qt-windows.ps1

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: bash scripts/ci/configure.sh ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload ctest logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-${{ matrix.name }}
          path: build/${{ matrix.preset }}/Testing/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Sanitizers (AddressSanitizer + UndefinedBehaviorSanitizer)
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers (ASan+UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: bash scripts/ci/install-deps-linux.sh

      - name: Configure
        run: cmake --preset asan -DNEKO_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset asan

  # ---------------------------------------------------------------------------
  # Code coverage
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: bash scripts/ci/install-deps-linux.sh lcov

      - name: Configure
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage --parallel

      - name: Test
        run: ctest --preset coverage

      - name: Collect coverage
        run: bash scripts/ci/collect-coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage/coverage-filtered.info

  # ---------------------------------------------------------------------------
  # Formatting gate (blocking)
  # ---------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: bash scripts/ci/check-format.sh
