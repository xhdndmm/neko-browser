name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-debug
            os: ubuntu-latest
            preset: debug
          - name: ubuntu-gcc-release
            os: ubuntu-latest
            preset: release
          - name: ubuntu-clang-debug
            os: ubuntu-latest
            preset: debug
            cc: clang
            cxx: clang++
          - name: windows-msvc-debug
            os: windows-latest
            preset: debug
            # Windows 上通过 vcpkg 提供 zlib/libjpeg/libwebp；Qt6 GUI 由 Linux/macOS
            # 任务覆盖（vcpkg 从源码编译 Qt 对 CI 而言过慢），故此处 NEKO_BUILD_UI=OFF。
          - name: macos-clang-debug
            os: macos-latest
            preset: debug
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libjpeg-dev libwebp-dev libfreetype-dev libssl-dev qt6-base-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jpeg webp qt freetype openssl

      # vcpkg 无官方 setup action，手动 clone + bootstrap（不依赖第三方 action）。
      - name: Set up vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib libjpeg-turbo libwebp freetype openssl

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          EXTRA_ARGS=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake -DNEKO_BUILD_UI=OFF"
          fi
          cmake --preset "${{ matrix.preset }}" -DNEKO_WARNINGS_AS_ERRORS=ON ${EXTRA_ARGS}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload ctest logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-${{ matrix.name }}
          path: build/${{ matrix.preset }}/Testing/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Sanitizers (AddressSanitizer + UndefinedBehaviorSanitizer)
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers (ASan+UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libjpeg-dev libwebp-dev libfreetype-dev libssl-dev qt6-base-dev

      - name: Configure
        run: cmake --preset asan -DNEKO_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset asan

  # ---------------------------------------------------------------------------
  # Code coverage
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov zlib1g-dev libjpeg-dev libwebp-dev libfreetype-dev libssl-dev qt6-base-dev

      - name: Configure
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage --parallel

      - name: Test
        run: ctest --preset coverage

      - name: Collect coverage
        run: |
          cd build/coverage
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch,negative,gcov,gcov
          lcov --remove coverage.info --output-file coverage-filtered.info \
            --ignore-errors unused \
            '/usr/*' '*/_deps/*' '*/tests/*' '*/build/*'
          lcov --list coverage-filtered.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage/coverage-filtered.info

  # ---------------------------------------------------------------------------
  # Formatting gate (blocking)
  # ---------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          sudo ln -sf "$(command -v clang-format-18)" /usr/local/bin/clang-format
          ./tools/check_format.sh
