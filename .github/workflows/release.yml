name: release

# -----------------------------------------------------------------------------
# 生产版本构建与发布。
#
# 触发方式：
#   1. 推送 vX.Y.Z（或 vX.Y.Z-<prerelease>）标签
#      → 构建三平台 × 双架构产物，创建 GitHub Release 并附加产物 + SHA256SUMS；
#   2. workflow_dispatch（手动触发）
#      → 执行同样的完整生产构建与测试，但只上传 workflow artifact，
#        不创建 Release（用于在真正打标签之前演练发布流程）。
#
# 构建配置（"生产版本"的明确定义）：
#   - CMake preset `release`：CMAKE_BUILD_TYPE=Release + LTO（NEKO_ENABLE_LTO=ON）
#   - NEKO_WARNINGS_AS_ERRORS=ON（与 CI 一致，见 AGENTS.md §13）
#   - 目标平台上运行完整 ctest 套件；测试不通过则不会产出 Release
#
# 脚本：workflow 中的命令逻辑都在 scripts/release/（Windows 为 .ps1，
# Linux/macOS 为 .sh）；workflow 只负责矩阵、编排与需要 GitHub 上下文的
# 步骤（上传产物、创建 Release）。约定见 docs/development/ci-scripts.md。
#
# 平台矩阵（Windows 全部使用 x64 runner；arm64 用 MSVC 交叉编译到 ARM64）：
#   linux   x86_64  ubuntu-26.04
#   linux   arm64   ubuntu-26.04-arm
#   windows x86_64  windows-2025      （MSVC + vcpkg + Qt6 GUI，原生 x64）
#   windows arm64   windows-2025      （MSVC 交叉编译到 ARM64 + Qt6 交叉编译包）
#   macos   x86_64  macos-26-intel
#   macos   arm64   macos-26
#
# 已知限制（同步记录在 docs/releases/README.md）：
#   - Windows ARM64 产物由 x64 runner 交叉编译，无法在 x64 上执行，故该任务
#     只构建打包、不运行 ctest（同一源码的测试由 windows x86_64 任务完整运行）；
#   - 产物为「零安装」形态（ADR 0019）：Windows 除 Qt（官方只提供动态库）与
#     FFmpeg（LGPL 要求保持动态链接，ADR 0014）外全部静态链接，Qt/FFmpeg/VC
#     运行库随包自带；Linux/macOS 把全部非系统第三方库捆绑进包内并改写
#     rpath/install name，glibc 与系统框架仍来自目标机器；
#   - 未做代码签名 / 公证 / 独立调试符号包（计划随 Phase 12+ 的发布工程落地）。
# -----------------------------------------------------------------------------

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 发布流程不允许被后续提交取消：中途取消会留下不完整的 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 版本解析 + 标签/CMakeLists 一致性校验（尽早失败，避免白跑 6 个构建任务）
  # ---------------------------------------------------------------------------
  prepare:
    name: prepare
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: meta
        shell: bash
        run: bash scripts/release/resolve-version.sh

  # ---------------------------------------------------------------------------
  # 生产构建矩阵：Release + LTO，构建后跑测试，再打包为平台产物
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-26.04
            platform: linux
            arch: x86_64
            archive_ext: tar.gz
          - name: linux-arm64
            os: ubuntu-26.04-arm
            platform: linux
            arch: arm64
            archive_ext: tar.gz
          - name: windows-x86_64
            os: windows-2025
            platform: windows
            arch: x86_64
            archive_ext: zip
            # VS 生成器的默认平台是宿主架构（x64）；目标平台必须用命令行 -A 显式指定。
            # （CMAKE_GENERATOR_PLATFORM 环境变量只在 CMAKE_GENERATOR 同时设置时才
            # 生效，单独设置会被静默忽略——见 2026-09 windows-arm64 链接失败复盘。）
            generator_platform: x64
            # 静态三元组（静态库 + 动态 CRT，与官方 Qt 的 /MD 一致）：除
            # FFmpeg 外的依赖全部静态链接，见 ADR 0019。
            vcpkg_triplet: x64-windows-static-md
            # FFmpeg 保持动态链接（LGPL 重链接义务，ADR 0014）：从动态
            # 三元组单独安装，运行库随包分发。
            vcpkg_dynamic_triplet: x64-windows
            # Qt6：官方 MSVC 预编译包（原生 x64）。
            qt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
            qt_host_arch: win64_msvc2022_64
            qt_host_dir: msvc2022_64
          - name: windows-arm64
            # Windows ARM64 没有官方原生宿主工具包：在 x64 runner 上交叉编译到 ARM64，
            # 目标库用 Qt 交叉编译包，宿主工具（moc/rcc/uic）用同版本 x64 包。
            os: windows-2025
            platform: windows
            arch: arm64
            archive_ext: zip
            generator_platform: ARM64
            vcpkg_triplet: arm64-windows-static-md
            vcpkg_dynamic_triplet: arm64-windows
            qt_arch: win64_msvc2022_arm64_cross_compiled
            qt_dir: msvc2022_arm64
            qt_host_arch: win64_msvc2022_64
            qt_host_dir: msvc2022_64
          - name: macos-x86_64
            os: macos-26-intel
            platform: macos
            arch: x86_64
            archive_ext: tar.gz
          - name: macos-arm64
            os: macos-26
            platform: macos
            arch: arm64
            archive_ext: tar.gz
    env:
      PACKAGE: neko-browser-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      # --- 依赖安装 -----------------------------------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/release/install-deps-linux.sh

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/release/install-deps-macos.sh

      - name: Set up vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/setup-vcpkg-windows.ps1

      # 依赖的二进制缓存：vcpkg 从源码构建 FFmpeg / OpenSSL / libavif 很慢，
      # 缓存命中后同一 triplet 的二次构建只需链接。
      - name: Restore vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.vcpkg_triplet }}-2026-09
          restore-keys: vcpkg-${{ matrix.vcpkg_triplet }}-

      # 依赖清单与“分两次安装（静态三元组 + 动态 FFmpeg）”的原因见
      # scripts/release/install-vcpkg-deps-windows.ps1。
      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
        run: ./scripts/release/install-vcpkg-deps-windows.ps1 -DynamicTriplet ${{ matrix.vcpkg_dynamic_triplet }}

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/install-qt-windows.ps1 -QtArch ${{ matrix.qt_arch }} -QtDir ${{ matrix.qt_dir }} -QtHostArch ${{ matrix.qt_host_arch }} -QtHostDir ${{ matrix.qt_host_dir }}

      # --- 配置 ---------------------------------------------------------------
      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake --preset release -DNEKO_WARNINGS_AS_ERRORS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/configure-windows.ps1 -Arch ${{ matrix.arch }} -GeneratorPlatform ${{ matrix.generator_platform }} -VcpkgTriplet ${{ matrix.vcpkg_triplet }} -VcpkgDynamicTriplet ${{ matrix.vcpkg_dynamic_triplet }}

      - name: Verify configured platform (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/verify-configured-platform-windows.ps1 -GeneratorPlatform ${{ matrix.generator_platform }} -VcpkgTriplet ${{ matrix.vcpkg_triplet }}

      # --- 构建与测试 ---------------------------------------------------------
      - name: Build
        run: cmake --build --preset release --parallel

      - name: Diagnose Windows link inputs (on failure)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/diagnose-link-inputs-windows.ps1

      # Windows ARM64 由 x64 runner 交叉编译，产物无法在 x64 上执行：跳过 ctest
      # （同一源码的测试由 windows x86_64 任务完整运行，两个任务的代码路径一致）。
      - name: Test
        if: ${{ !(matrix.platform == 'windows' && matrix.arch == 'arm64') }}
        run: ctest --preset release

      - name: Upload ctest logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-${{ matrix.name }}
          path: build/release/Testing/
          if-no-files-found: ignore

      # --- 架构校验 -----------------------------------------------------------
      # 断言逻辑与理由见 scripts/release/verify-artifact-arch-unix.sh /
      # verify-artifact-arch-windows.ps1。
      - name: Verify artifact architecture (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/release/verify-artifact-arch-unix.sh ${{ matrix.arch }}

      - name: Verify artifact architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/verify-artifact-arch-windows.ps1 -Arch ${{ matrix.arch }}

      # --- 打包 ---------------------------------------------------------------
      # 零安装产物（ADR 0019）：打包与冒烟细节见 scripts/release/package-unix.sh。
      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/release/package-unix.sh ${{ matrix.platform }} "${{ needs.prepare.outputs.version }}"

      # 零安装产物（ADR 0019）：除 Qt 与 FFmpeg 外全部静态链接，Qt/FFmpeg/VC
      # 运行库随包分发；详细清单与理由见 scripts/release/package-windows.ps1。
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/package-windows.ps1 -Arch ${{ matrix.arch }} -VcpkgDynamicTriplet ${{ matrix.vcpkg_dynamic_triplet }} -QtArch ${{ matrix.qt_arch }} -QtHostArch ${{ matrix.qt_host_arch }}

      # 零安装校验：被静态链接的依赖不得再以 DLL 形式出现；运行库必须随包；
      # 包内每个 PE 文件（exe + dll）的导入表只能引用包内文件、系统 DLL 或
      # Windows API set。判定细节见 scripts/release/verify-package-windows.ps1。
      - name: Verify package dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/verify-package-windows.ps1

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.PACKAGE }}.${{ matrix.archive_ext }}
            ${{ env.PACKAGE }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布：合并全部产物 → 校验 SHA256 → 创建（或更新）GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: publish
    needs: [prepare, build]
    # 只在标签推送时发布；workflow_dispatch 仅做演练构建。
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: bash scripts/release/generate-sha256sums.sh

      - name: Write release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: bash scripts/release/write-release-notes.sh

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: bash scripts/release/publish-release.sh
