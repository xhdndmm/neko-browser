name: static-analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# NOTE: This job is experimental.  clang-tidy check availability varies across
# toolchain versions, so the job is non-gating (continue-on-error) until the
# check set is stabilized.  See docs/development/coding-style.md.
# 具体命令逻辑在 scripts/static-analysis/run-clang-tidy.sh。
concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18

      - name: Install system dependencies
        run: sudo apt-get install -y zlib1g-dev libjpeg-dev libwebp-dev libfreetype-dev libssl-dev qt6-base-dev

      - name: Configure (compile_commands)
        run: |
          cmake --preset debug \
            -DNEKO_BUILD_TESTS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNEKO_WARNINGS_AS_ERRORS=OFF

      - name: Run clang-tidy
        run: bash scripts/static-analysis/run-clang-tidy.sh
