<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Form Interaction Test</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  h1 { font-size: 20px; }
  .card { border: 1px solid #ccc; padding: 12px; margin: 16px 0; }
  label { margin-right: 6px; }
  input[type=text] { padding: 4px 8px; font-size: 14px; }
  button { font-size: 14px; padding: 5px 14px; }
  #status { color: #050; font-weight: bold; min-height: 1.2em; }
  #result { background: #f5f5f5; padding: 8px; margin-top: 8px; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>Form Interaction Test</h1>

  <p>此页面自提交（action 指向自身）。提交后页面重载并把查询参数显示在下方。</p>

  <div class="card">
    <b>GET 表单</b>：输入 q 点 Search → 页面重载并显示 <code>?q=...</code>（地址栏变化）。
    <form id="f1" action="form_interaction_test.html" method="get">
      <label>q</label><input name="q" type="text" value="hello">
      <button type="submit">Search</button>
    </form>
  </div>

  <div class="card">
    <b>preventDefault 表单</b>：提交被页内 <code>submit</code> 监听器拦截，不导航。
    <form id="f2" action="form_interaction_test.html" method="get">
      <label>x</label><input name="x" type="text" value="blocked">
      <button type="submit">Blocked submit</button>
    </form>
  </div>

  <p id="status"></p>
  <div id="result">(no query)</div>

  <script>
    // Show the current query string from a self-submitting GET form.
    var result = document.getElementById('result');
    var query = window.location.search;
    if (query && query.length > 1) {
      result.textContent = 'submitted: ' + query;
    }

    // Block the second form's submission.
    document.getElementById('f2').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('status').textContent = 'blocked submit (preventDefault)';
    });
  </script>
</body>
</html>
