<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Geometry Test</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  h1 { font-size: 20px; }
  .card { border: 1px solid #ccc; padding: 12px; margin: 16px 0; }
  #box {
    width: 200px; height: 80px;
    margin: 20px;
    padding: 12px;
    border: 4px solid #369;
    background: #eef;
  }
  #inline { background: #ffe; }
  button { font-size: 14px; padding: 5px 14px; margin-right: 8px; }
  pre { background: #f5f5f5; padding: 10px; font-size: 13px; }
</style>
</head>
<body>
  <h1>DOM Geometry Test</h1>
  <p>显示 getBoundingClientRect / offsetWidth / clientWidth 等几何 API 的<b>真实布局值</b>（content-box：offset = 内容 + border + padding）。</p>

  <div class="card">
    <b>块级元素</b>（width 200 / height 80 / margin 20 / padding 12 / border 4）：
    <div id="box">box</div>
  </div>

  <div class="card">
    <b>行内元素</b>（聚合其文本 run 的几何）：<span id="inline">inline text</span>
  </div>

  <div class="card">
    <button id="shrink">缩为 width:120px</button>
    <button id="restore">恢复 width:200px</button>
    <span id="hint"></span>
  </div>

  <pre id="out"></pre>

  <script>
    function measure() {
      var box = document.getElementById('box');
      var sp = document.getElementById('inline');
      var r = box.getBoundingClientRect();
      var lines = [];
      lines.push('box.offsetWidth   = ' + box.offsetWidth);
      lines.push('box.offsetHeight  = ' + box.offsetHeight);
      lines.push('box.offsetLeft    = ' + box.offsetLeft);
      lines.push('box.offsetTop     = ' + box.offsetTop);
      lines.push('box.offsetParent  = ' + (box.offsetParent ? box.offsetParent.tagName : 'null'));
      lines.push('box.clientWidth   = ' + box.clientWidth);
      lines.push('box.clientHeight  = ' + box.clientHeight);
      lines.push('box.clientLeft    = ' + box.clientLeft);
      lines.push('box.clientTop     = ' + box.clientTop);
      lines.push('rect.x / y        = ' + r.x + ' / ' + r.y);
      lines.push('rect.w / h        = ' + r.width + ' / ' + r.height);
      lines.push('rect.left / top   = ' + r.left + ' / ' + r.top);
      lines.push('rect.right/bottom = ' + r.right + ' / ' + r.bottom);
      lines.push('rect.toJSON().w   = ' + r.toJSON().width);
      lines.push('span.offsetWidth  = ' + sp.offsetWidth);
      lines.push('span rect.x       = ' + sp.getBoundingClientRect().x);
      document.getElementById('out').textContent = lines.join('\n');
    }

    measure();

    document.getElementById('shrink').addEventListener('click', function () {
      document.getElementById('box').style.width = '120px';
      document.getElementById('hint').textContent = '(样式已改为 120px，等待重排…)';
      // The style change is applied to the layout after the script run; re-measure
      // on the next tick so the geometry reflects the updated layout.
      setTimeout(measure, 0);
    });
    document.getElementById('restore').addEventListener('click', function () {
      document.getElementById('box').style.width = '200px';
      document.getElementById('hint').textContent = '(样式已恢复 200px，等待重排…)';
      setTimeout(measure, 0);
    });
  </script>
</body>
</html>
